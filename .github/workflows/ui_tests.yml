# .github/workflows/ui-tests.yml
# ──────────────────────────────────────────────────────────────────────────
#  SauceDemo POM – CI/CD Pipeline
#
#  Triggers : push / PR to main or develop
#  Matrix   : Chromium & Firefox (headless)
#  Artefacts: HTML report + pytest log (retained 14 days)
# ──────────────────────────────────────────────────────────────────────────

name: UI Tests – SauceDemo POM

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      browser:
        description: "Browser to run (chromium | firefox | all)"
        required: false
        default: "all"

# Cancel any in-progress run for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# FIX 1: opt into Node.js 24 now to silence deprecation warnings
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: ${{ matrix.browser }} – Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
        python-version: ["3.12"]

    env:
      BASE_URL:           https://www.saucedemo.com
      USERNAME:           standard_user
      PASSWORD:           secret_sauce
      BROWSER:            ${{ matrix.browser }}
      HEADLESS:           "true"
      SLOWMO:             "0"
      VIEWPORT_WIDTH:     "1280"
      VIEWPORT_HEIGHT:    "720"
      DEFAULT_TIMEOUT:    "15000"
      NAVIGATION_TIMEOUT: "30000"

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ────────────────────────────────────────────
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # ── 3. Install Python dependencies ──────────────────────────────
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── 4. Install Playwright browsers ──────────────────────────────
      - name: Install Playwright browsers + OS deps
        run: |
          python -m playwright install ${{ matrix.browser }} --with-deps

      # ── 5. Create reports directory ─────────────────────────────────
      #  FIX 2: must exist before pytest runs so log_file can be written
      - name: Create reports directory
        run: mkdir -p reports

      # ── 6. Run tests ────────────────────────────────────────────────
      #  FIX 3: use --browser (pytest-playwright flag), not --browser-name
      #         pass --html here; remove it from pytest.ini addopts to avoid
      #         the duplicate-report / no-collection exit-code-4 clash
      - name: Run pytest (${{ matrix.browser }})
        run: |
          pytest tests/ \
            --browser ${{ matrix.browser }} \
            --html=reports/report-${{ matrix.browser }}.html \
            --self-contained-html \
            --tb=short \
            -v
        continue-on-error: true   # always upload report even on test failure
        id: run_tests

      # ── 7. Upload HTML report + log ──────────────────────────────────
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.browser }}-py${{ matrix.python-version }}
          path: |
            reports/report-${{ matrix.browser }}.html
            reports/pytest.log
          if-no-files-found: warn
          retention-days: 14

      # ── 8. Fail the job if tests failed ─────────────────────────────
      #  Separate step so upload always runs first (continue-on-error above)
      - name: Assert tests passed
        if: steps.run_tests.outcome == 'failure'
        run: |
          echo "Tests failed – see uploaded report for details"
          exit 1

  # ── Aggregate status check ──────────────────────────────────────────
  all-browsers-passed:
    name: All browsers passed
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Check matrix result
        run: |
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "One or more browser jobs failed!"
            exit 1
          fi
          echo "All browser jobs passed ✓"