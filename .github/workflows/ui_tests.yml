# .github/workflows/ui-tests.yml
# ──────────────────────────────────────────────────────────────────────────
#  SauceDemo POM – CI/CD Pipeline
#
#  Triggers  : push / PR → main or develop
#  Matrix    : Chromium & Firefox (headless)
#  Artifacts : HTML report, pytest log, screenshots (on failure), traces (on failure)
# ──────────────────────────────────────────────────────────────────────────

name: UI Tests – SauceDemo POM

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      browser:
        description: "Browser to run (chromium | firefox | all)"
        required: false
        default: "all"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Opt into Node.js 24 to silence deprecation warnings
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: ${{ matrix.browser }} – Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
        python-version: ["3.12"]

    env:
      BASE_URL:           https://www.saucedemo.com
      USERNAME:           ${{ secrets.SAUCE_USERNAME }}
      PASSWORD:           ${{ secrets.SAUCE_PASSWORD }}
      BROWSER:            ${{ matrix.browser }}
      HEADLESS:           "true"
      SLOWMO:             "0"
      VIEWPORT_WIDTH:     "1280"
      VIEWPORT_HEIGHT:    "720"
      DEFAULT_TIMEOUT:    "15000"
      NAVIGATION_TIMEOUT: "30000"

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python setup ──────────────────────────────────────────────────
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # ── 3. Install Python dependencies ───────────────────────────────────
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── 4. Install Playwright browser + OS deps ──────────────────────────
      - name: Install Playwright browser
        run: python -m playwright install ${{ matrix.browser }} --with-deps

      # ── 5. Create all report sub-directories ─────────────────────────────
      #       Must exist before pytest so log_file, screenshots, traces can write
      - name: Create report directories
        run: mkdir -p reports/screenshots reports/traces

      # ── 6. Run tests ─────────────────────────────────────────────────────
      - name: Run pytest (${{ matrix.browser }})
        id: run_tests
        continue-on-error: true        # let upload steps always run
        run: |
          pytest tests/ \
            --browser ${{ matrix.browser }} \
            --html=reports/report-${{ matrix.browser }}.html \
            --self-contained-html \
            --tb=short \
            -v

      # ── 7. Upload HTML report ─────────────────────────────────────────────
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-report-${{ matrix.browser }}-py${{ matrix.python-version }}
          path: |
            reports/report-${{ matrix.browser }}.html
            reports/pytest.log
          if-no-files-found: warn
          retention-days: 14

      # ── 8. Upload screenshots (only when tests fail) ──────────────────────
      - name: Upload failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.browser }}-py${{ matrix.python-version }}
          path: reports/screenshots/
          if-no-files-found: ignore    # no screenshots = all tests passed
          retention-days: 14

      # ── 9. Upload Playwright traces (only when tests fail) ────────────────
      - name: Upload failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traces-${{ matrix.browser }}-py${{ matrix.python-version }}
          path: reports/traces/
          if-no-files-found: ignore    # no traces = all tests passed
          retention-days: 14

      # ── 10. Fail the job after all uploads are done ───────────────────────
      - name: Assert tests passed
        if: steps.run_tests.outcome == 'failure'
        run: |
          echo "❌ Tests failed – download the artifacts above for details."
          echo "   • HTML report  : html-report-${{ matrix.browser }}"
          echo "   • Screenshots  : screenshots-${{ matrix.browser }}"
          echo "   • Traces       : traces-${{ matrix.browser }}"
          echo "   View a trace   : npx playwright show-trace <trace.zip>"
          exit 1

  # ── Aggregate gate ────────────────────────────────────────────────────────
  all-browsers-passed:
    name: All browsers passed
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Check matrix result
        run: |
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "One or more browser jobs failed!"
            exit 1
          fi
          echo "✅ All browser jobs passed"