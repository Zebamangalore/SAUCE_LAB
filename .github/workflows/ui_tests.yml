# .github/workflows/ui-tests.yml
# ──────────────────────────────────────────────────────────────────────────
#  SauceDemo POM – CI/CD Pipeline
#
#  Triggers : push / PR to main or develop
#  Matrix   : Chromium & Firefox (headless)
#  Artefacts: HTML report + pytest log (retained 14 days)
# ──────────────────────────────────────────────────────────────────────────

name: UI Tests – SauceDemo POM

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # Allow manual runs from the Actions tab
  workflow_dispatch:
    inputs:
      browser:
        description: "Browser to run (chromium | firefox | all)"
        required: false
        default: "all"

# Cancel any in-progress run for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.browser }} – Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false          # let both browsers finish even if one fails
      matrix:
        browser: [chromium, firefox]
        python-version: ["3.12"]

    # ── Environment variables (override .env defaults in CI) ───────────
    env:
      BASE_URL:           https://www.saucedemo.com
      USERNAME:           standard_user
      PASSWORD:           secret_sauce
      BROWSER:            ${{ matrix.browser }}
      HEADLESS:           "true"
      VIEWPORT_WIDTH:     "1280"
      VIEWPORT_HEIGHT:    "720"
      DEFAULT_TIMEOUT:    "15000"
      NAVIGATION_TIMEOUT: "30000"
      HTML_REPORT:        reports/report.html

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ────────────────────────────────────────────
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # ── 3. Install Python dependencies ──────────────────────────────
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── 4. Install Playwright browsers ──────────────────────────────
      - name: Install Playwright browsers + OS deps
        run: |
          python -m playwright install ${{ matrix.browser }} --with-deps

      # ── 5. Create reports directory ─────────────────────────────────
      - name: Create reports directory
        run: mkdir -p reports

      # ── 6. Run tests ────────────────────────────────────────────────
      - name: Run pytest (browser = ${{ matrix.browser }})
        run: |
          pytest \
            --browser-name=${{ matrix.browser }} \
            --html=reports/report-${{ matrix.browser }}.html \
            --self-contained-html \
            -v
        # Don't fail the upload step if tests fail
        continue-on-error: false

      # ── 7. Upload HTML report ────────────────────────────────────────
      - name: Upload HTML test report
        if: always()   # upload even on test failure
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.browser }}-py${{ matrix.python-version }}
          path: |
            reports/report-${{ matrix.browser }}.html
            reports/pytest.log
          retention-days: 14

  # ── Aggregate status check ──────────────────────────────────────────
  all-browsers-passed:
    name: All browsers passed
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Check matrix result
        run: |
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "One or more browser jobs failed!"
            exit 1
          fi
          echo "All browser jobs passed ✓"