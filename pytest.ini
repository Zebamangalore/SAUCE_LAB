[pytest]
# ──────────────────────────────────────────────
#  SauceDemo POM – pytest configuration
# ──────────────────────────────────────────────

# Discover tests anywhere under tests/
testpaths = tests

# Default CLI flags.
# NOTE: --html is intentionally omitted here.
#       CI passes --html=reports/report-<browser>.html per matrix job.
#       For local runs: pytest --html=reports/report.html --self-contained-html
addopts =
    -v
    --tb=short
    -p no:warnings

# ── Registered markers ───────────────────────────────────────
markers =
    smoke:      Critical path tests that must pass on every build
    regression: Full regression suite
    login:      Login-related test scenarios
    cart:       Shopping-cart test scenarios
    slow:       Tests that take more than 10 s

# ── Logging ──────────────────────────────────────────────────
log_cli             = true
log_cli_level       = INFO
log_cli_format      = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S

log_file            = reports/pytest.log
log_file_level      = DEBUG
log_file_format     = %(asctime)s [%(levelname)s] %(name)s (%(filename)s:%(lineno)d): %(message)s
log_file_date_format= %Y-%m-%d %H:%M:%S